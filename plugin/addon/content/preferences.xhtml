<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-density"
      data-l10n-id="pref-density"
    ></html:label>
    <menulist
      id="zotero-prefpane-__addonRef__-density"
      preference="density"
      native="true"
    >
      <menupopup>
        <menuitem label="5%" value="5" />
        <menuitem label="10%" value="10" />
        <menuitem label="15%" value="15" />
        <menuitem label="20%" value="20" />
      </menupopup>
    </menulist>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-autoRun"
    preference="autoRun"
    data-l10n-id="pref-autorun"
  />
  <hbox align="center">
    <html:label
      for="zotero-prefpane-__addonRef__-serverUrl"
      data-l10n-id="pref-server-url"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-serverUrl"
      preference="serverUrl"
    ></html:input>
  </hbox>
  <html:p data-l10n-id="pref-server-help"></html:p>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
